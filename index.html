<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Forward Place</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;800&family=Noto+Sans+JP:wght@300;400;500&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --ink: #0d0f0e;
    --panel: #14312e;
    --line: rgba(238,236,228,0.10);
    --line-strong: rgba(238,236,228,0.24);
    --paper: #eeece4;
    --paper-dim: #9d9b90;
    --paper-faint: #636156;
    --accent: #c9a15a;
    --accent-soft: rgba(201,161,90,0.14);
  }
  *{ box-sizing:border-box; margin:0; padding:0; }
  html{ background:var(--ink); }
  body{
    background:var(--ink);
    color:var(--paper);
    font-family:'Noto Sans JP', -apple-system, BlinkMacSystemFont, sans-serif;
    font-weight:300;
    line-height:1.9;
    -webkit-font-smoothing:antialiased;
    padding:72px 20px 56px;
  }
  .page{ max-width:640px; margin:0 auto; }

  /* ---- header ---- */
  .brand{
    display:flex;
    align-items:center;
    gap:10px;
    margin-bottom:46px;
  }
  .brand svg{ flex-shrink:0; }
  .brand span{
    font-family:'JetBrains Mono', monospace;
    font-size:11.5px;
    letter-spacing:0.32em;
    color:var(--paper-dim);
  }
  h1{
    font-family:'Shippori Mincho', serif;
    font-weight:800;
    font-size:clamp(28px, 5vw, 38px);
    letter-spacing:0.02em;
    line-height:1.55;
    text-wrap:balance;
    color:var(--paper);
    margin-bottom:22px;
  }
  .lede{
    max-width:44ch;
    color:var(--paper-dim);
    font-size:14.5px;
    line-height:1.95;
    margin-bottom:30px;
  }
  .hairline{
    height:1px;
    background:linear-gradient(90deg, var(--accent) 0 56px, var(--line) 56px 100%);
  }

  /* ---- sections ---- */
  section{ padding:40px 0; border-bottom:1px solid var(--line); }
  section:last-of-type{ border-bottom:none; }
  .eyebrow{
    font-family:'JetBrains Mono', monospace;
    font-size:11px;
    letter-spacing:0.22em;
    text-transform:uppercase;
    color:var(--paper-faint);
    margin-bottom:20px;
  }

  /* ---- product grid（複数プロダクトの一覧） ---- */
  .product-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:12px;
  }
  .product-card{
    display:block;
    background:rgba(255,255,255,0.04);
    border:0.5px solid var(--line-strong);
    border-radius:10px;
    padding:18px 16px;
    text-decoration:none;
    color:inherit;
    transition:border-color .2s ease;
  }
  a.product-card:hover{ border-color:var(--accent); }
  .product-card .icon{
    width:34px; height:34px;
    border-radius:8px;
    background:var(--accent-soft);
    display:flex; align-items:center; justify-content:center;
    overflow:hidden;
    margin-bottom:12px;
  }
  .product-card .icon img{ width:100%; height:100%; object-fit:cover; }
  .product-card .name{ font-weight:700; font-size:15px; margin-bottom:6px; color:var(--paper); }
  .product-card .desc{ font-size:12.5px; color:var(--paper-dim); line-height:1.75; margin-bottom:12px; }
  .product-card .badge{
    display:inline-block;
    font-size:10.5px;
    font-weight:500;
    padding:3px 10px;
    border-radius:20px;
    background:var(--accent-soft);
    color:var(--accent);
  }
  .product-card.placeholder{
    display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center;
    border-style:dashed;
    background:transparent;
  }
  .product-card.placeholder .icon{ background:rgba(238,236,228,0.06); color:var(--paper-faint); margin-bottom:10px; }
  .product-card.placeholder .status-text{ font-size:12px; color:var(--paper-dim); font-weight:500; }

  /* ---- info rows ---- */
  .info-row{
    display:grid;
    grid-template-columns:120px 1fr;
    gap:16px;
    padding:16px 0;
    border-top:1px solid var(--line);
    font-size:13.5px;
  }
  .info-row:last-child{ border-bottom:1px solid var(--line); }
  .info-row dt{ color:var(--paper-faint); font-weight:400; }
  .info-row dd{ color:var(--paper); min-width:0; }
  .contact-line{ display:flex; align-items:center; flex-wrap:wrap; gap:10px; }
  .contact-line span{ font-family:'JetBrains Mono', monospace; font-size:13px; min-width:0; overflow-wrap:anywhere; }
  .copy-btn{
    background:none;
    border:none;
    color:var(--accent);
    font-family:'Noto Sans JP', sans-serif;
    font-size:12px;
    letter-spacing:0.02em;
    cursor:pointer;
    text-decoration:underline;
    text-underline-offset:3px;
    text-decoration-color:var(--accent-soft);
    padding:0;
    transition:text-decoration-color .2s ease, color .2s ease;
  }
  .copy-btn:hover{ text-decoration-color:var(--accent); }
  .copy-btn:focus-visible{ outline:1px solid var(--accent); outline-offset:3px; }

  footer{
    display:flex;
    align-items:center;
    justify-content:center;
    flex-wrap:wrap;
    gap:8px 18px;
    margin-top:56px;
    color:var(--paper-faint);
    font-size:11.5px;
    letter-spacing:0.08em;
  }
  footer .footer-brand{ display:flex; align-items:center; gap:10px; }
  footer svg{ opacity:0.6; }
  footer a{
    color:var(--paper-dim);
    text-underline-offset:3px;
    text-decoration-color:var(--line-strong);
  }
  footer a:hover{ text-decoration-color:var(--accent); }
  footer a:focus-visible{ outline:1px solid var(--accent); outline-offset:3px; }
</style>
</head>
<body>
<div class="page">

  <header>
    <div class="brand">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none">
        <circle cx="12" cy="12" r="9" stroke="#c9a15a" stroke-width="1.3"/>
        <line x1="12" y1="12" x2="9" y2="7" stroke="#c9a15a" stroke-width="1.3" stroke-linecap="round"/>
        <line x1="12" y1="12" x2="15.5" y2="6.5" stroke="#c9a15a" stroke-width="1.3" stroke-linecap="round"/>
      </svg>
      <span>FORWARD&nbsp;PLACE</span>
    </div>
    <h1>習慣を変えて、人生を前へ。</h1>
    <p class="lede">習慣を整えるアプリケーションの企画・開発・運営を行う、Forward Place のサイトです。</p>
    <div class="hairline"></div>
  </header>

  <section>
    <div class="eyebrow">プロダクト</div>
    <div class="product-grid">
      <a class="product-card" href="/anti-dopa.html">
        <div class="icon"><img src="icon-anti-dopa.png" alt=""></div>
        <div class="name">Anti-Dopa</div>
        <div class="desc">開きかけたアプリの前に、ひと呼吸をつくるアプリ</div>
        <span class="badge">近日公開</span>
      </a>
      <div class="product-card placeholder">
        <div class="icon">…</div>
        <div class="status-text">新しいプロダクトを開発中</div>
      </div>
    </div>
  </section>

  <section>
    <div class="eyebrow">事業者情報</div>
    <dl>
      <div class="info-row">
        <dt>運営</dt>
        <dd>Forward Place</dd>
      </div>
      <div class="info-row">
        <dt>事業内容</dt>
        <dd>スマートフォン向けアプリケーションの企画・開発・運営</dd>
      </div>
      <div class="info-row">
        <dt>お問い合わせ</dt>
        <dd class="contact-line">
          <span id="email-text">forwardplace.support@gmail.com</span>
          <button class="copy-btn" onclick="copyEmail()">コピー</button>
        </dd>
      </div>
    </dl>
  </section>

  <footer>
    <div class="footer-brand">
      <svg width="12" height="12" viewBox="0 0 24 24" fill="none">
        <circle cx="12" cy="12" r="9" stroke="#636156" stroke-width="1.4"/>
        <line x1="12" y1="12" x2="9" y2="7" stroke="#636156" stroke-width="1.4" stroke-linecap="round"/>
        <line x1="12" y1="12" x2="15.5" y2="6.5" stroke="#636156" stroke-width="1.4" stroke-linecap="round"/>
      </svg>
      <span>Forward Place</span>
    </div>
    <a href="/privacy.html">プライバシーポリシー</a>
    <a href="/terms.html">利用規約</a>
    <a href="/tokushoho.html">特定商取引法に基づく表記</a>
  </footer>

</div>
<script>
  function copyEmail(){
    const email = document.getElementById('email-text').innerText;
    navigator.clipboard.writeText(email).then(()=>{
      alert('メールアドレスをクリップボードにコピーしました!');
    }).catch(err=>{
      console.error('コピーに失敗しました', err);
    });
  }
</script>
</body>
</html>
